apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/traefik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Cilium LB pool must exist before Traefik service requests a LoadBalancer IP
  # Infisical must be ready before Traefik (for secrets sync)
  dependsOn:
    - name: cilium-lb
    - name: infisical
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik
  timeout: 5m
