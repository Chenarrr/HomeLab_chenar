apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: echovote
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: echovote-gitops
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: echovote-server
      namespace: echovote
    - apiVersion: apps/v1
      kind: Deployment
      name: echovote-client
      namespace: echovote
  timeout: 5m
