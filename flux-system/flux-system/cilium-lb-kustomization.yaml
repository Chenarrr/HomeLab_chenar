apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-lb
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/cilium-lb
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # CiliumLoadBalancerIPPool and CiliumL2AnnouncementPolicy — no dependencies
  timeout: 2m
