apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/cert-manager-issuers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Must wait for cert-manager CRDs to exist before applying ClusterIssuer
  dependsOn:
    - name: cert-manager
  timeout: 2m
