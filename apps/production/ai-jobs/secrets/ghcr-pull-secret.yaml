# Syncs GHCR pull secret into ai-jobs namespace so pods can pull images.
# Add to Infisical at: project homelab-e-bm-i / env prod / path /ai-jobs
# Key: .dockerconfigjson  Value: <base64 dockerconfig for ghcr.io>
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ghcr-pull-secret-sync
  namespace: ai-jobs
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/ai-jobs"
        recursive: false
  managedKubeSecretReferences:
    - secretName: ghcr-pull-secret
      secretNamespace: ai-jobs
      secretType: "kubernetes.io/dockerconfigjson"
      creationPolicy: Owner
      template:
        includeAllSecrets: true
