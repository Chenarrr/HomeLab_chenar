apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: ai-jobs
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux-bot
        email: flux@chenar.space
      messageTemplate: "chore(images): update ai-jobs images"
    push:
      branch: main
  update:
    strategy: Setters
    path: ./apps/production/ai-jobs
