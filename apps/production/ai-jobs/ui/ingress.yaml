---
# HTTP → HTTPS redirect for UI
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-jobs-ui-http
  namespace: ai-jobs
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ai-jobs.chenar.space`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: ai-jobs
      services:
        - name: ai-jobs-ui
          port: 8501
---
# HTTPS IngressRoute for AI Jobs UI
# ai-jobs.chenar.space → Streamlit on 8501
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-jobs-ui-tls
  namespace: ai-jobs
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ai-jobs.chenar.space`)
      kind: Rule
      services:
        - name: ai-jobs-ui
          port: 8501
  tls:
    certResolver: letsencrypt-prod
