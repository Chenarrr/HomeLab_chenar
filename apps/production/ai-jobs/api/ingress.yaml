---
# HTTP → HTTPS redirect for API
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-jobs-api-http
  namespace: ai-jobs
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ai-jobs-api.chenar.space`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: ai-jobs
      services:
        - name: ai-jobs-api
          port: 8000
---
# HTTP → HTTPS redirect middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: ai-jobs
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTPS IngressRoute for AI Jobs API — IP restricted (your IP only)
# ai-jobs-api.chenar.space → FastAPI on 8000
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-jobs-api-tls
  namespace: ai-jobs
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ai-jobs-api.chenar.space`)
      kind: Rule
      middlewares:
        - name: private-access
          namespace: traefik
      services:
        - name: ai-jobs-api
          port: 8000
  tls:
    certResolver: letsencrypt-prod
