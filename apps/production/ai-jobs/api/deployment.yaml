apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-jobs-api
  namespace: ai-jobs
  labels:
    app: ai-jobs-api
spec:
  replicas: 0
  selector:
    matchLabels:
      app: ai-jobs-api
  template:
    metadata:
      labels:
        app: ai-jobs-api
    spec:
      serviceAccountName: ai-jobs-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/chenarrr/ai-jobs-api:v1.0.2 # {"$imagepolicy": "flux-system:ai-jobs-api"}
          ports:
            - containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8000"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
