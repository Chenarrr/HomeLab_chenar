---
# ─── HTTP (port 80) ───────────────────────────────────────────────────────────

# Server paths on HTTP
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-server-http
  namespace: echovote
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`echovote.chenar.space`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`) || PathPrefix(`/uploads`))
      kind: Rule
      priority: 10
      services:
        - name: echovote-server
          port: 3001
---
# HTTP → HTTPS redirect middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: echovote
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTP → HTTPS redirect (all other traffic)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-redirect-https
  namespace: echovote
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`echovote.chenar.space`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-https
      services:
        - name: echovote-client
          port: 80
---
# ─── HTTPS (port 443) ─────────────────────────────────────────────────────────

# echovote.chenar.space → EchoVote frontend (catch-all, priority 1)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-client-tls
  namespace: echovote
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`echovote.chenar.space`)
      kind: Rule
      priority: 1
      services:
        - name: echovote-client
          port: 80
  tls:
    certResolver: letsencrypt-prod
