---
# ─── HTTP (port 80) — hostname-based only ─────────────────────────────────────

# Server paths
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-server-http
  namespace: echovote
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`echovote.chenar.space`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`) || PathPrefix(`/uploads`))
      kind: Rule
      priority: 10
      services:
        - name: echovote-server
          port: 3001
---
# Client SPA
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-client-http
  namespace: echovote
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`echovote.chenar.space`)
      kind: Rule
      priority: 1
      services:
        - name: echovote-client
          port: 80
---
# ─── Middlewares ──────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: echovote
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Hostname-based HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-redirect-https
  namespace: echovote
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`echovote.chenar.space`)
      kind: Rule
      priority: 20
      middlewares:
        - name: redirect-to-https
      services:
        - name: echovote-client
          port: 80
---
# ─── HTTPS (port 443) — hostname-based ────────────────────────────────────────
# TLS auto-issued by Traefik + Let's Encrypt

# echovote.chenar.space → EchoVote frontend
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-client-tls
  namespace: echovote
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`echovote.chenar.space`)
      kind: Rule
      services:
        - name: echovote-client
          port: 80
  tls:
    certResolver: letsencrypt-prod
