---
# RedisShake config template — password injected at pod startup from Secret
# Source: Bitnami Sentinel (auto-discovers master, no hardcoded IPs)
# Target: Opstree replication-master service (stable DNS, always points to master)
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-shake-config
  namespace: echovote-infra
data:
  shake.toml.tmpl: |
    [sync_reader]
    # Direct master pod — PSYNC requires master, not sentinel port
    # Update address if Bitnami does failover (query: sentinel masters mymaster)
    address = "redis-node-1.redis-headless.echovote.svc.cluster.local:6379"
    password = "__REDIS_PASSWORD__"

    [redis_writer]
    # Opstree master service — always routes to current master
    address = "echovote-redis-v2-replication-master.echovote-infra.svc.cluster.local:6379"
    password = "__REDIS_PASSWORD__"

    [advanced]
    log_level = "info"
    status_port = 0
