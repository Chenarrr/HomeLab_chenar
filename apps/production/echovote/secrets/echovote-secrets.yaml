apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: echovote-secrets-sync
  namespace: echovote
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      # Get these from Infisical Cloud → your project → Access → Machine Identities
      identityId: "509f03ee-bcfd-4794-91e6-2a2a727fb222"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/echovote"
        recursive: false
  managedKubeSecretReferences:
    - secretName: echovote-secrets
      secretNamespace: echovote
      creationPolicy: Owner
      template:
        includeAllSecrets: true
