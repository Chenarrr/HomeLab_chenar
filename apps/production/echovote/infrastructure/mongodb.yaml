---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: echovote
data:
  # Shell script: env vars are substituted by the shell before mongosh sees them
  10-create-app-user.sh: |
    #!/bin/bash
    set -eu
    echo "Creating echovote application user..."
    mongosh --quiet \
      "mongodb://root:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin" \
      --eval "
        db.getSiblingDB('echovote').createUser({
          user: 'echovote',
          pwd: '${MONGO_APP_PASSWORD}',
          roles: [{ role: 'readWrite', db: 'echovote' }]
        });
        print('User echovote created.');
      "
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: echovote
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: echovote
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  strategy:
    type: Recreate   # needed for PVC with ReadWriteOnce
  template:
    metadata:
      labels:
        app: mongo
    spec:
      securityContext:
        fsGroup: 999   # mongodb group in official image
      containers:
        - name: mongo
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-helm-values
                  key: rootPassword
            - name: MONGO_INITDB_DATABASE
              value: echovote
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-helm-values
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            # TCP check is instant — mongosh takes >1s to start
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
        - name: init
          configMap:
            name: mongo-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-mongodb
  namespace: echovote
  labels:
    app: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
