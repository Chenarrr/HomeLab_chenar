---
# HTTPS IngressRoute for EchoVote API + WebSocket
# Routes echovote.chenar.space/api|socket.io|health|uploads → echovote-server:3001
# TLS cert issued by Traefik built-in ACME (letsencrypt-prod)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-api-tls
  namespace: echovote
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`echovote.chenar.space`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`) || PathPrefix(`/uploads`))
      kind: Rule
      priority: 10
      services:
        - name: echovote-server
          port: 3001
  tls:
    certResolver: letsencrypt-prod
