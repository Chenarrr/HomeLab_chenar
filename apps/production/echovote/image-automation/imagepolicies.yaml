apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: echovote-server
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: echovote-server
  # Match semver tags (v1.2.3) — manually promoted to production
  filterTags:
    pattern: '^v(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)$'
    extract: '$major.$minor.$patch'
  policy:
    semver:
      range: '>=0.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: echovote-client
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: echovote-client
  # Match semver tags (v1.2.3) — manually promoted to production
  filterTags:
    pattern: '^v(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)$'
    extract: '$major.$minor.$patch'
  policy:
    semver:
      range: '>=0.0.0'
