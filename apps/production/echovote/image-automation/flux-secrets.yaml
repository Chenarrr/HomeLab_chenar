# GHCR auth for Flux image scanning — lives in flux-system namespace.
# Infisical syncs the dockerconfig from /flux path in your project.
# Key in Infisical: .dockerconfigjson (must be exact key name)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: echovote-ghcr-auth-sync
  namespace: flux-system
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "YOUR_MACHINE_IDENTITY_ID"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "YOUR_PROJECT_SLUG"
        envSlug: "prod"
        secretsPath: "/flux"
        recursive: false
  managedKubeSecretReferences:
    - secretName: echovote-ghcr-auth
      secretNamespace: flux-system
      secretType: "kubernetes.io/dockerconfigjson"
      creationPolicy: Owner
      template:
        includeAllSecrets: true
