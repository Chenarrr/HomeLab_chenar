---
# Sync redis password from Infisical into echovote-infra namespace
# RedisReplication + RedisSentinel CRDs reference secret "redis-helm-values" in their namespace
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: redis-secrets-sync
  namespace: echovote-infra
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/echovote-redis"
        recursive: false
  managedKubeSecretReferences:
    - secretName: redis-helm-values
      secretNamespace: echovote-infra
      creationPolicy: Owner
      template:
        includeAllSecrets: true
