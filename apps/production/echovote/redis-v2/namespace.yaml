apiVersion: v1
kind: Namespace
metadata:
  name: echovote-infra
  labels:
    kubernetes.io/metadata.name: echovote-infra
    # baseline — Opstree pods need service links disabled, not always via CRD
    # restricted would reject pods without full container securityContext control
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
