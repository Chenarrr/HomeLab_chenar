---
# Opstree RedisSentinel — new Redis cluster alongside Bitnami
# Services created: echovote-redis-v2 (6379) + echovote-redis-v2-sentinel (26379)
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: echovote-redis-v2
  namespace: echovote
spec:
  clusterSize: 3

  redisSentinelConfig:
    redisReplicationName: echovote-redis-v2-replication
    masterGroupName: mymaster
    quorum: "2"
    downAfterMilliseconds: "5000"
    failoverTimeout: "10000"
    parallelSyncs: "1"
    # Password for Sentinel to authenticate with Redis nodes
    redisReplicationPassword:
      secretKeyRef:
        name: redis-helm-values
        key: password

  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    # Password for Redis nodes
    redisSecret:
      name: redis-helm-values
      key: password
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
