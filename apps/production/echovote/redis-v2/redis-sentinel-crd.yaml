---
# RedisReplication — 3 pods (1 master + 2 replicas) in echovote-infra namespace
# No Bitnami "redis" service exists here → REDIS_PORT env var collision avoided
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: echovote-redis-v2-replication
  namespace: echovote-infra
spec:
  clusterSize: 3
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-helm-values
      key: password
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  storage:
    keepAfterDelete: false
    volumeClaimTemplate:
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
  podSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    fsGroup: 1000
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: echovote-redis-v2-replication
---
# RedisSentinel — 3 sentinel pods watching the replication above
# Service: echovote-redis-v2-sentinel.echovote-infra.svc.cluster.local:26379
# Master group name: mymaster (must match REDIS_SENTINEL_MASTER env in server)
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: echovote-redis-v2
  namespace: echovote-infra
spec:
  clusterSize: 3
  redisSentinelConfig:
    redisReplicationName: echovote-redis-v2-replication
    masterGroupName: mymaster
    quorum: "2"
    downAfterMilliseconds: "5000"
    failoverTimeout: "10000"
    parallelSyncs: "1"
    redisReplicationPassword:
      secretKeyRef:
        name: redis-helm-values
        key: password
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.0.15
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: redis-helm-values
      key: password
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  podSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    fsGroup: 1000
