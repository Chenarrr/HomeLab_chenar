---
# Default deny all ingress in echovote-infra
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: echovote-infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow echovote-server → redis-v2 replication pods (port 6379)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-echovote-server-to-redis-v2
  namespace: echovote-infra
spec:
  podSelector:
    matchLabels:
      app: echovote-redis-v2-replication
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: echovote
          podSelector:
            matchLabels:
              app: echovote-server
      ports:
        - port: 6379
---
# Allow echovote-server → sentinel pods (port 26379) — for sentinel discovery
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-echovote-server-to-sentinel-v2
  namespace: echovote-infra
spec:
  podSelector:
    matchLabels:
      app: echovote-redis-v2-sentinel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: echovote
          podSelector:
            matchLabels:
              app: echovote-server
      ports:
        - port: 26379
---
# Allow redisinsight → redis-v2 (port 6379 + 26379)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redisinsight-to-redis-v2
  namespace: echovote-infra
spec:
  podSelector:
    matchLabels:
      app: echovote-redis-v2-replication
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redisinsight
      ports:
        - port: 6379
        - port: 26379
---
# Allow intra-namespace — replication pods talk to each other + sentinel talks to replication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-echovote-infra
  namespace: echovote-infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Allow Opstree operator → redis-v2 pods (operator reconciles from redis-operator-system)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-to-redis-v2
  namespace: echovote-infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator-system
      ports:
        - port: 6379
        - port: 26379
---
# Allow RedisShake (runs in echovote-infra) → redis-v2 replication master (target)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redisshake-to-redis-v2
  namespace: echovote-infra
spec:
  podSelector:
    matchLabels:
      app: echovote-redis-v2-replication
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: redis-shake
      ports:
        - port: 6379
