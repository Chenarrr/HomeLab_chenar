---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: portfolio
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-redirect-https
  namespace: portfolio
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`chenar.space`) || Host(`www.chenar.space`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-https
      services:
        - name: portfolio
          port: 80
---
# HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio-tls
  namespace: portfolio
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`chenar.space`) || Host(`www.chenar.space`)
      kind: Rule
      priority: 1
      services:
        - name: portfolio
          port: 80
  tls:
    certResolver: letsencrypt-prod
