---
# Syncs app secrets from Infisical /liftlog path → liftlog-secrets k8s Secret
# Keys required in Infisical (prod env, /liftlog path):
#   DATABASE_URL   — postgres://liftlog:<password>@liftlog-postgres.liftlog.svc.cluster.local:5432/liftlog?sslmode=disable
#   TOKEN_SECRET   — min 32 random bytes (openssl rand -hex 32)
#   REDIS_ADDR     — liftlog-redis.liftlog.svc.cluster.local:6379
#   REDIS_PASSWORD — redis AUTH password
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: liftlog-secrets-sync
  namespace: liftlog
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/liftlog"
        recursive: false
  managedKubeSecretReferences:
    - secretName: liftlog-secrets
      secretNamespace: liftlog
      creationPolicy: Owner
      template:
        includeAllSecrets: true
