---
# Syncs GHCR pull credentials from Infisical /liftlog path → ghcr-pull-secret
# Key required in Infisical (prod env, /liftlog path):
#   .dockerconfigjson — base64-encoded docker config with ghcr.io creds
#     Generate: echo '{"auths":{"ghcr.io":{"auth":"<base64(user:PAT)>"}}}' | base64 -w0
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: liftlog-ghcr-pull-secret-sync
  namespace: liftlog
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/liftlog"
        recursive: false
  managedKubeSecretReferences:
    - secretName: ghcr-pull-secret
      secretNamespace: liftlog
      secretType: "kubernetes.io/dockerconfigjson"
      creationPolicy: Owner
      template:
        includeAllSecrets: true
