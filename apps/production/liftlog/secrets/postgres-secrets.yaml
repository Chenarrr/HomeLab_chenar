---
# Syncs Postgres credentials from Infisical /liftlog-postgres path → postgres-secrets
# Keys required in Infisical (prod env, /liftlog-postgres path):
#   POSTGRES_USER     — liftlog
#   POSTGRES_PASSWORD — <strong random password>
#   POSTGRES_DB       — liftlog
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: liftlog-postgres-secrets-sync
  namespace: liftlog
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/liftlog-postgres"
        recursive: false
  managedKubeSecretReferences:
    - secretName: postgres-secrets
      secretNamespace: liftlog
      creationPolicy: Owner
      template:
        includeAllSecrets: true
