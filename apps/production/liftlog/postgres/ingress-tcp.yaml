---
# Private TCP access to Postgres — home IP only
# Connect: psql -h 178.105.91.23 -p 5432 -U liftlog -d liftlog
# Requires Traefik `postgres` TCP entrypoint (see infrastructure/traefik/helmrelease.yaml)
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: liftlog-postgres-tcp
  namespace: liftlog
spec:
  entryPoints:
    - postgres
  routes:
    - match: HostSNI(`*`)
      middlewares:
        - name: private-tcp-access
          namespace: traefik
      services:
        - name: liftlog-postgres
          port: 5432
