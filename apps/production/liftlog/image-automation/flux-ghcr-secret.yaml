---
# Syncs GHCR credentials for Flux image scanning (flux-system namespace)
# Same .dockerconfigjson key from Infisical /liftlog path
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: liftlog-ghcr-auth-sync
  namespace: flux-system
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/liftlog"
        recursive: false
  managedKubeSecretReferences:
    - secretName: liftlog-ghcr-auth
      secretNamespace: flux-system
      secretType: "kubernetes.io/dockerconfigjson"
      creationPolicy: Owner
      template:
        includeAllSecrets: true
