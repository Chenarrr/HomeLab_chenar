---
# Syncs pgAdmin credentials from Infisical /pgadmin path
# Keys required in Infisical (prod env, /pgadmin path):
#   PGADMIN_DEFAULT_EMAIL    — your login email
#   PGADMIN_DEFAULT_PASSWORD — strong password (min 12 chars)
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pgadmin-secrets-sync
  namespace: pgadmin
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/pgadmin"
        recursive: false
  managedKubeSecretReferences:
    - secretName: pgadmin-secrets
      secretNamespace: pgadmin
      creationPolicy: Owner
      template:
        includeAllSecrets: true
