apiVersion: v1
kind: Namespace
metadata:
  name: pgadmin
  labels:
    kubernetes.io/metadata.name: pgadmin
    # pgAdmin runs as root internally (uses sudo in entrypoint) — privileged PSA required
    # Access is restricted to home IP only via Traefik private-access middleware
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
