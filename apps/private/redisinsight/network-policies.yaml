---
# Default: deny all ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: redisinsight
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow traefik → redisinsight (port 5540)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-redisinsight
  namespace: redisinsight
spec:
  podSelector:
    matchLabels:
      app: redisinsight
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 5540
