apiVersion: apps/v1
kind: Deployment
metadata:
  name: echovote-server
  namespace: echovote-dev
  labels:
    app: echovote-server
spec:
  replicas: 0
  selector:
    matchLabels:
      app: echovote-server
  template:
    metadata:
      labels:
        app: echovote-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/chenarrr/echovote-server:dev-20260510192124 # {"$imagepolicy": "flux-system:echovote-server-dev"}
          ports:
            - containerPort: 3001
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: echovote-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: echovote-secrets
                  key: JWT_SECRET
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: echovote-secrets
                  key: YOUTUBE_API_KEY
            - name: SUPER_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: echovote-secrets
                  key: SUPER_ADMIN_KEY
            - name: CLIENT_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: echovote-secrets
                  key: CLIENT_ORIGIN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: echovote-secrets
                  key: REDIS_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads
          emptyDir: {}
