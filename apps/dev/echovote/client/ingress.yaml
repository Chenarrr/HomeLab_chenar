---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: echovote-dev
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-dev-redirect-https
  namespace: echovote-dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`echovote.dev.chenar.space`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-https
      services:
        - name: echovote-client
          port: 80
---
# HTTPS server routes (API + socket)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-dev-api-tls
  namespace: echovote-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`echovote.dev.chenar.space`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`) || PathPrefix(`/uploads`))
      kind: Rule
      priority: 10
      middlewares:
        - name: private-access
          namespace: traefik
      services:
        - name: echovote-server
          port: 3001
  tls:
    certResolver: letsencrypt-prod
---
# HTTPS client catch-all
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: echovote-dev-client-tls
  namespace: echovote-dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`echovote.dev.chenar.space`)
      kind: Rule
      priority: 1
      middlewares:
        - name: private-access
          namespace: traefik
      services:
        - name: echovote-client
          port: 80
  tls:
    certResolver: letsencrypt-prod
