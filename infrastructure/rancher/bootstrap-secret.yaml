apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: rancher-bootstrap-sync
  namespace: cattle-system
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 509f03ee-bcfd-4794-91e6-2a2a727fb222
      serviceAccountRef:
        name: infisical-token-reviewer
        namespace: infisical-system
  managedKubeSecretReferences:
    - secretName: rancher-bootstrap-secret
      secretType: Opaque
      secretsScope:
        envSlug: prod
        secretsPath: "/rancher"
        includeAllSecrets: true
