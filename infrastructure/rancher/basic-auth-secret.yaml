---
# BasicAuth credentials for the Rancher IngressRoute.
#
# Generate the htpasswd line locally and paste it below:
#
#   htpasswd -nbB chenar "your-strong-password"
#
# That prints something like:
#   chenar:$2y$05$Q4...long-bcrypt-hash...
#
# Put that whole line in `users` (replace placeholder).
# Multiple users: one per line.
#
# Until you replace this placeholder the BasicAuth challenge will reject
# all credentials — i.e. Rancher is fully locked until you set it.

apiVersion: v1
kind: Secret
metadata:
  name: rancher-basic-auth
  namespace: cattle-system
type: Opaque
stringData:
  users: |
    chenar:$2y$05$..Hc9coFC1deAgvJ0Ps.mOttCvyDy9O39H3yvFB6w9Iyum2muZMwG
