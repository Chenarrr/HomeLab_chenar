---
# BasicAuth middleware — uses rancher-basic-auth Secret
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rancher-basic-auth
  namespace: cattle-system
spec:
  basicAuth:
    secret: rancher-basic-auth
    realm: "Rancher Homelab"
---
# HTTP → HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: cattle-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rancher-redirect-https
  namespace: cattle-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`rancher.chenar.space`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-https
      services:
        - name: rancher
          port: 80
---
# HTTPS route — BasicAuth + Traefik ACME cert
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rancher-tls
  namespace: cattle-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rancher.chenar.space`)
      kind: Rule
      priority: 1
      middlewares:
        - name: rancher-basic-auth
      services:
        - name: rancher
          port: 80
  tls:
    certResolver: letsencrypt-prod
