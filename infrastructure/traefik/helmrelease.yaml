apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: ">=30.0.0 <35.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    crds: Create          # install IngressRoute, Middleware, etc. CRDs
  upgrade:
    crds: CreateReplace   # keep CRDs up to date on upgrades
  values:
    # NodePort — no LoadBalancer in homelab
    service:
      type: NodePort

    ports:
      # App traffic — accessible at http://178.105.91.23:30080
      web:
        port: 8000
        nodePort: 30080
      # HTTPS (for when cert-manager is added)
      websecure:
        port: 8443
        nodePort: 30443
      # Dashboard — accessible at http://178.105.91.23:30900/dashboard/
      traefik:
        port: 9000
        nodePort: 30900
        expose:
          default: true

    # Enable dashboard + insecure API (homelab — no auth needed)
    api:
      dashboard: true
      insecure: true

    # Disable the built-in IngressRoute for dashboard (we expose it via NodePort directly)
    ingressRoute:
      dashboard:
        enabled: false

    logs:
      general:
        level: INFO
      access:
        enabled: true

    # Allow IngressRoute resources from any namespace (echovote → flux-system)
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false   # IngressRoute CRDs only — no standard Ingress
