apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 2m
  chart:
    spec:
      chart: traefik
      version: ">=30.0.0 <41.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: true
    crds: Create          # install IngressRoute, Middleware, etc. CRDs
  upgrade:
    crds: CreateReplace   # keep CRDs up to date on upgrades
  values:
    # LoadBalancer — Cilium LB IPAM assigns 178.105.91.23 from the homelab-public pool.
    # Port 80/443 become directly accessible (no :30080/:30443 needed).
    # NodePort is kept as a fallback for direct IP access during DNS propagation.
    service:
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Local
      labels:
        cilium-lb-pool: homelab   # matches the CiliumLoadBalancerIPPool serviceSelector

    ports:
      # HTTP — port 80 directly accessible via LB, :30080 via NodePort fallback
      web:
        port: 8000
        nodePort: 30080
        expose:
          default: true

      # HTTPS — port 443 directly accessible via LB, :30443 via NodePort fallback
      websecure:
        port: 8443
        nodePort: 30443
        expose:
          default: true

      # Traefik dashboard — NodePort only, not exposed via LB (keep private)
      traefik:
        port: 9000
        nodePort: 30900
        expose:
          default: true

    # Enable dashboard + insecure API on the traefik entrypoint (homelab only)
    api:
      dashboard: true
      insecure: true

    persistence:
      enabled: true
      size: 128Mi
      path: /data

    additionalArguments:
      - "--api.insecure=true"
      - "--certificatesresolvers.letsencrypt-prod.acme.email=chenar.breshk@gmail.com"
      - "--certificatesresolvers.letsencrypt-prod.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt-prod.acme.httpchallenge.entrypoint=web"

    # Disable built-in dashboard IngressRoute (we access it via NodePort :30900)
    ingressRoute:
      dashboard:
        enabled: false

    logs:
      general:
        level: INFO
      access:
        enabled: true

    providers:
      # IngressRoute CRDs — primary routing (cross-namespace for echovote)
      kubernetesCRD:
        allowCrossNamespace: true

      # Standard Ingress — enabled for cert-manager HTTP-01 ACME challenge solver.
      # cert-manager creates temporary Ingress objects; Traefik serves them.
      # Does NOT conflict with IngressRoute — both providers coexist.
      kubernetesIngress:
        enabled: true
        ingressClass: traefik
