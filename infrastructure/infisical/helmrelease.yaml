apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-secrets-operator
  namespace: infisical
spec:
  interval: 1h
  chart:
    spec:
      chart: secrets-operator
      version: ">=0.8.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    controllerManager:
      manager:
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
