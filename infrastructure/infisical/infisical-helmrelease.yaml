apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: infisical
spec:
  interval: 1h
  chart:
    spec:
      chart: infisical-standalone
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    postgresql:
      enabled: true
      auth:
        username: infisical
        password: infisical-postgres-password-change-me
        database: infisical
      primary:
        persistence:
          enabled: true
          size: 10Gi
        nodeSelector:
          kubernetes.io/hostname: ubuntu-8gb-homelab2

    redis:
      enabled: true
      auth:
        enabled: false
      master:
        persistence:
          enabled: true
          size: 2Gi
        nodeSelector:
          kubernetes.io/hostname: ubuntu-8gb-homelab2

    infisical:
      nodeSelector:
        kubernetes.io/hostname: ubuntu-8gb-homelab2

    # Disable bundled nginx — Traefik handles ingress
    ingress:
      enabled: false
    ingress-nginx:
      enabled: false
