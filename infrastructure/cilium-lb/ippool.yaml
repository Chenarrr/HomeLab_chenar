---
# Cilium LB IPAM pool — assigns 178.105.91.23 to LoadBalancer services.
# Cilium's kube-proxy replacement (eBPF) routes port 80/443 traffic to
# the service without needing a separate load balancer process.
# L2 announcement is NOT needed because this IP is already on the primary
# network interface; Cilium eBPF intercepts packets at the TC layer.
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-public
spec:
  # Single public IP — shared across all LoadBalancer services (Traefik gets all ports)
  blocks:
    - cidr: "178.105.91.23/32"
  serviceSelector:
    matchLabels:
      cilium-lb-pool: homelab   # only services with this label get IPs from this pool
