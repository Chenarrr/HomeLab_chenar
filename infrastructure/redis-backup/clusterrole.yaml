apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-backup
rules:
  # Discover all RedisReplication clusters (reads annotations for password secret info)
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redisreplications"]
    verbs: ["get", "list"]
  # Read Redis password secrets from cluster namespaces
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # List pods (for diagnostics / finding master pod in restore)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
