apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: redis-backup
spec:
  # Runs daily at 10:10 Erbil time (UTC+3) = 07:10 UTC
  schedule: "10 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: redis-backup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: false  # apk add needs root
          containers:
            - name: backup
              image: alpine/k8s:1.32.3
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: redis-backup-secrets
                      key: S3_BUCKET
                - name: S3_REGION
                  valueFrom:
                    secretKeyRef:
                      name: redis-backup-secrets
                      key: S3_REGION
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: redis-backup-secrets
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: redis-backup-secrets
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: scripts
              configMap:
                name: redis-backup-script
                defaultMode: 0755
