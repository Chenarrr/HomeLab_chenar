apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: redis-backup-secrets
  namespace: redis-backup
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-e-bm-i
        envSlug: prod
        secretsPath: /redis-backup
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: redis-backup
  managedSecretReference:
    secretName: redis-backup-secrets
    secretNamespace: redis-backup
    creationPolicy: Owner
