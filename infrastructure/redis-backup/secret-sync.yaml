apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: redis-backup-secrets-sync
  namespace: redis-backup
spec:
  hostAPI: https://app.infisical.com/api
  syncConfig:
    resyncInterval: 60s
  authentication:
    kubernetesAuth:
      identityId: "bb4c4eec-3767-4447-a806-c079360125d0"
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-service-account
        namespace: default
      secretsScope:
        projectSlug: "homelab-e-bm-i"
        envSlug: "prod"
        secretsPath: "/redis-backup"
        recursive: false
  managedKubeSecretReferences:
    - secretName: redis-backup-secrets
      secretNamespace: redis-backup
      creationPolicy: Owner
      template:
        includeAllSecrets: true
