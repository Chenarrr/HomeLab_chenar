apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-backup-script
  namespace: redis-backup
data:
  backup.sh: |
    #!/bin/sh
    set -e

    echo "=== Redis AOF Backup $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

    # Install tools (kubectl already in alpine/k8s image)
    apk add --no-cache aws-cli redis >/dev/null 2>&1

    # K8s API credentials (auto-mounted by K8s into every pod)
    KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    K8S=https://kubernetes.default.svc

    TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    SUCCESS=0
    FAIL=0

    # ── Helpers ──────────────────────────────────────────────────────────────

    k8s_get() {
      curl -sf --cacert "$KUBE_CA" -H "Authorization: Bearer $KUBE_TOKEN" "$K8S$1"
    }

    redis_cmd() {
      _host=$1; _port=$2; _pass=$3; shift 3
      if [ -n "$_pass" ]; then
        redis-cli -h "$_host" -p "$_port" -a "$_pass" --no-auth-warning "$@"
      else
        redis-cli -h "$_host" -p "$_port" "$@"
      fi
    }

    # ── Discover clusters ─────────────────────────────────────────────────────
    # Lists all RedisReplication objects cluster-wide.
    # Each one needs these annotations to be backed up:
    #   redis-backup/password-secret: "<secret-name>"
    #   redis-backup/password-key:    "<key-in-secret>"  (default: "password")

    echo "Discovering Redis clusters..."

    k8s_get "/apis/redis.redis.opstreelabs.in/v1beta2/redisreplications" \
      | jq -r '.items[] | [
          .metadata.namespace,
          .metadata.name,
          (.metadata.annotations["redis-backup/password-secret"] // ""),
          (.metadata.annotations["redis-backup/password-key"] // "password")
        ] | join(" ")' > /tmp/clusters.txt

    if [ ! -s /tmp/clusters.txt ]; then
      echo "No RedisReplication clusters found — nothing to back up"
      exit 0
    fi

    echo "Found $(wc -l < /tmp/clusters.txt) cluster(s)"

    # ── Backup each cluster ───────────────────────────────────────────────────

    while IFS=" " read -r NS NAME SECRET_NAME SECRET_KEY; do
      echo ""
      echo "--- $NS/$NAME ---"

      # 1. Get Redis password from the K8s secret named in the annotation
      REDIS_PASSWORD=""
      if [ -n "$SECRET_NAME" ]; then
        REDIS_PASSWORD=$(
          k8s_get "/api/v1/namespaces/$NS/secrets/$SECRET_NAME" \
            | jq -r ".data[\"$SECRET_KEY\"] // empty" \
            | base64 -d 2>/dev/null || true
        )
      fi
      [ -z "$REDIS_PASSWORD" ] && echo "WARN: no password found — connecting without auth"

      # 2. Opstree always exposes the master at: <name>-master.<namespace>.svc.cluster.local
      REDIS_HOST="${NAME}-master.${NS}.svc.cluster.local"
      REDIS_PORT="6379"
      MASTER_POD="${NAME}-0"
      AOF_FILE="/tmp/${NS}-${NAME}.tar.gz"

      # 3. Compact AOF before backup (smaller file, consistent state)
      echo "Compacting AOF on $REDIS_HOST..."
      redis_cmd "$REDIS_HOST" "$REDIS_PORT" "$REDIS_PASSWORD" BGREWRITEAOF 2>/dev/null || true

      # Poll INFO persistence until aof_rewrite_in_progress = 0 (max 30s)
      REWRITE_DONE=0
      for i in $(seq 1 30); do
        IN_PROGRESS=$(redis_cmd "$REDIS_HOST" "$REDIS_PORT" "$REDIS_PASSWORD" \
          INFO persistence 2>/dev/null \
          | grep "aof_rewrite_in_progress" | tr -d '[:space:]' | cut -d: -f2)
        if [ "$IN_PROGRESS" = "0" ]; then
          echo "AOF compact done (${i}s)"
          REWRITE_DONE=1
          break
        fi
        sleep 1
      done
      [ "$REWRITE_DONE" = "0" ] && echo "WARN: compact still running after 30s — backing up as-is"

      # 4. Stream the AOF directory out of the master pod
      # Redis 7+ uses multi-part AOF stored in /data/appendonlydir/ (not a single file)
      echo "Downloading /data/appendonlydir from pod $NS/$MASTER_POD..."
      kubectl exec "$MASTER_POD" -n "$NS" -- tar -czf - -C /data appendonlydir > "$AOF_FILE"
      EXEC_RC=$?
      echo "kubectl exec exit code: $EXEC_RC | file size: $(stat -c%s "$AOF_FILE" 2>/dev/null || echo missing)"

      if [ ! -s "$AOF_FILE" ]; then
        echo "ERROR: AOF download failed for $NS/$NAME (exit $EXEC_RC)"
        FAIL=$((FAIL + 1))
        continue
      fi

      # 5. Collect metadata
      KEY_COUNT=$(redis_cmd "$REDIS_HOST" "$REDIS_PORT" "$REDIS_PASSWORD" DBSIZE 2>/dev/null | tr -d '[:space:]' || echo 0)
      AOF_SIZE=$(stat -c%s "$AOF_FILE")
      META_FILE="/tmp/${NS}-${NAME}-meta.json"

      jq -n \
        --arg ts    "$TIMESTAMP" \
        --arg ns    "$NS" \
        --arg name  "$NAME" \
        --arg host  "$REDIS_HOST" \
        --argjson keys "${KEY_COUNT:-0}" \
        --argjson size "$AOF_SIZE" \
        '{timestamp:$ts,namespace:$ns,cluster:$name,host:$host,key_count:$keys,aof_size_bytes:$size,backup_type:"aof",backup_ok:true}' \
        > "$META_FILE"

      # 6. Upload AOF + metadata to S3
      # Layout: s3://<bucket>/redis-backups/<namespace>/<cluster>/<timestamp>/
      S3_PATH="s3://${S3_BUCKET}/redis-backups/${NS}/${NAME}/${TIMESTAMP}"
      aws s3 cp "$AOF_FILE"  "${S3_PATH}/appendonly.tar.gz" --region "$S3_REGION" --quiet
      aws s3 cp "$META_FILE" "${S3_PATH}/meta.json"      --region "$S3_REGION" --quiet

      echo "OK: $NS/$NAME → $S3_PATH (keys: ${KEY_COUNT:-0}, size: ${AOF_SIZE}B)"
      SUCCESS=$((SUCCESS + 1))

      rm -f "$AOF_FILE" "$META_FILE"

    done < /tmp/clusters.txt

    # ── Summary ───────────────────────────────────────────────────────────────
    echo ""
    echo "=== Done: $SUCCESS succeeded, $FAIL failed ==="

    # Exit non-zero if any cluster failed so K8s marks the job as failed
    [ "$FAIL" -eq 0 ]
