---
# Opstree Redis Operator — manages RedisReplication + RedisSentinel CRDs
# Installs into its own namespace; creates cluster-wide CRDs + RBAC
apiVersion: v1
kind: Namespace
metadata:
  name: redis-operator-system
  labels:
    kubernetes.io/metadata.name: redis-operator-system
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
  namespace: redis-operator-system
spec:
  interval: 2m
  chart:
    spec:
      chart: redis-operator
      version: ">=0.15.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: ot-helm
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    # Operator watches all namespaces by default
    redisOperator:
      imagePullPolicy: IfNotPresent
